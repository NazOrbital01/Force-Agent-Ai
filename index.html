<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forcx Agent Ai</title>
  <style>
    :root {
      --bg: #0b0d12;
      --bg-elev: #12151d;
      --bg-elev-2: #181c27;
      --border: #252b3a;
      --text: #e7eaf3;
      --muted: #8b93a7;
      --accent: #6c5ce7;
      --accent-2: #00d2ff;
      --danger: #ff5c7a;
      --code-bg: #0f1219;
      --user-bubble: #1c2130;
    }
    [data-theme="light"] {
      --bg: #f7f8fb;
      --bg-elev: #ffffff;
      --bg-elev-2: #eef1f7;
      --border: #dfe3ec;
      --text: #141824;
      --muted: #68718a;
      --accent: #5b4bd6;
      --accent-2: #0088cc;
      --danger: #e6395a;
      --code-bg: #f1f3f8;
      --user-bubble: #e9ecf5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); overflow: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; height: 100dvh; overflow: hidden; }
    .sidebar {
      width: 280px; flex-shrink: 0; background: var(--bg-elev);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 16px 12px; gap: 12px; height: 100dvh; z-index: 50;
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; }
    .brand { font-weight: 800; font-size: 20px; letter-spacing: -0.6px; }
    .brand span {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .new-chat-btn {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg-elev-2); color: var(--text); font-weight: 600; transition: 0.15s;
    }
    .new-chat-btn:hover { border-color: var(--accent); background: rgba(108,92,231,0.12); }
    .new-chat-btn span { font-size: 18px; line-height: 1; }
    .incognito-toggle {
      display: flex; align-items: center; gap: 8px; padding: 7px 8px;
      border-radius: 9px; font-size: 13px; color: var(--muted);
      cursor: pointer; user-select: none;
    }
    .incognito-toggle:hover { background: var(--bg-elev-2); }
    .incognito-toggle input { display: none; }
    .toggle-track {
      width: 34px; height: 19px; border-radius: 999px; background: var(--border);
      position: relative; transition: 0.2s; flex-shrink: 0;
    }
    .toggle-thumb {
      position: absolute; width: 15px; height: 15px; border-radius: 50%;
      background: var(--muted); top: 2px; left: 2px; transition: 0.2s;
    }
    .incognito-toggle input:checked + .toggle-track { background: var(--accent); }
    .incognito-toggle input:checked + .toggle-track .toggle-thumb {
      transform: translateX(15px); background: white;
    }
    .sidebar-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); padding: 6px 8px 2px;
    }
    .history {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      gap: 4px; min-height: 0;
    }
    .history-item {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 9px 10px; border-radius: 9px; color: var(--muted);
      font-size: 13.5px; cursor: pointer; transition: 0.12s;
    }
    .history-item:hover { background: var(--bg-elev-2); color: var(--text); }
    .history-item.active { background: rgba(108,92,231,0.16); color: var(--text); }
    .history-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-del {
      opacity: 0; background: none; border: 0; color: var(--muted);
      font-size: 16px; padding: 0 4px;
    }
    .history-item:hover .history-del { opacity: 1; }
    .history-del:hover { color: var(--danger); }
    .history-empty { padding: 12px 10px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
    .sidebar-footer { padding-top: 4px; }
    .prefs-btn {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 9px; background: transparent; color: var(--muted);
      font-size: 13px; text-align: left; transition: 0.15s;
    }
    .prefs-btn:hover { color: var(--text); background: var(--bg-elev-2); border-color: var(--accent); }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border: 1px solid transparent; border-radius: 8px;
      background: transparent; color: var(--muted); font-size: 18px;
    }
    .icon-btn:hover { background: var(--bg-elev-2); color: var(--text); }
    .menu-btn, .close-sidebar { display: none !important; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100dvh; }
    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .model-badge {
      font-size: 12px; color: var(--muted); border: 1px solid var(--border);
      padding: 4px 9px; border-radius: 999px; background: var(--bg-elev);
    }
    .topbar-right {
      margin-left: auto; display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--muted);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #2ecc71;
      box-shadow: 0 0 8px rgba(46,204,113,0.6);
    }
    .status-dot.busy { background: var(--accent-2); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .incognito-banner {
      display: none; align-items: center; justify-content: center; gap: 8px;
      padding: 8px 16px; background: rgba(108,92,231,0.12);
      border-bottom: 1px solid rgba(108,92,231,0.25); color: var(--accent-2);
      font-size: 12.5px; font-weight: 600; flex-shrink: 0;
    }
    .messages { flex: 1; overflow-y: auto; padding: 24px 20px 10px; scroll-behavior: smooth; }
    .msg {
      display: flex; gap: 12px; max-width: 840px; margin: 0 auto 22px;
    }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 30px; height: 30px; border-radius: 9px; display: grid;
      place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .avatar.ai { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }
    .avatar:not(.ai) {
      background: var(--bg-elev-2); border: 1px solid var(--border);
      color: var(--muted); font-size: 10px;
    }
    .msg.user .bubble {
      background: var(--user-bubble); border: 1px solid var(--border);
      border-radius: 14px 4px 14px 14px; padding: 10px 14px; max-width: 85%;
    }
    .msg.assistant .bubble { padding: 2px 0; max-width: 100%; flex: 1; min-width: 0; }
    .message-content { font-size: 15px; line-height: 1.65; word-wrap: break-word; overflow-wrap: anywhere; }
    .message-content p { margin: 0 0 12px; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content ul, .message-content ol { margin: 0 0 12px; padding-left: 24px; }
    .message-content li { margin: 4px 0; }
    .message-content h1, .message-content h2, .message-content h3, .message-content h4 {
      margin: 18px 0 10px; line-height: 1.25;
    }
    .message-content blockquote {
      margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid var(--accent);
      color: var(--muted); background: var(--bg-elev); border-radius: 0 8px 8px 0;
    }
    .message-content a { color: var(--accent-2); }
    .msg-attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .attachment-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--bg-elev-2); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 8px; font-size: 12px; color: var(--muted);
    }
    .attachment-remove {
      background: none; border: 0; color: var(--muted); font-size: 14px;
      padding: 0; line-height: 1;
    }
    .attachment-remove:hover { color: var(--danger); }
    .code-block {
      margin: 12px 0; border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; background: var(--code-bg);
    }
    .code-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 12px; background: var(--bg-elev-2);
      border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted);
    }
    .code-lang { text-transform: lowercase; }
    .copy-btn {
      border: 1px solid var(--border); background: var(--bg-elev); color: var(--muted);
      border-radius: 6px; padding: 3px 9px; font-size: 11px; transition: 0.15s;
    }
    .copy-btn:hover { color: var(--text); border-color: var(--accent); }
    .copy-btn.copied { color: #2ecc71; border-color: #2ecc71; }
    .code-block pre { margin: 0; padding: 14px; overflow-x: auto; }
    .code-block code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px; line-height: 1.55; white-space: pre; color: #d7dce8;
    }
    [data-theme="light"] .code-block code { color: #24292f; }
    .composer-wrap { padding: 10px 20px 14px; flex-shrink: 0; }
    .composer {
      max-width: 840px; margin: 0 auto; background: var(--bg-elev);
      border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .composer:focus-within { border-color: rgba(108,92,231,0.6); box-shadow: 0 0 0 3px rgba(108,92,231,0.12); }
    #input {
      width: 100%; background: transparent; border: 0; outline: none;
      resize: none; color: var(--text); font-size: 15px; line-height: 1.5;
      max-height: 200px; padding: 6px 4px;
    }
    #input::placeholder { color: var(--muted); }
    .composer-actions {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 6px;
    }
    .attach-btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 7px 10px;
      border-radius: 8px; color: var(--muted); font-size: 13px; cursor: pointer;
      border: 1px solid transparent;
    }
    .attach-btn:hover { background: var(--bg-elev-2); color: var(--text); border-color: var(--border); }
    .send-btn {
      padding: 8px 18px; border: 0; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; font-weight: 700; font-size: 14px; transition: opacity 0.15s, transform 0.1s;
    }
    .send-btn:hover { opacity: 0.9; }
    .send-btn:active { transform: scale(0.97); }
    .send-btn.stop { background: var(--danger); }
    .composer-hint {
      max-width: 840px; margin: 8px auto 0; text-align: center;
      font-size: 11px; color: var(--muted);
    }
    .welcome { max-width: 700px; margin: 8vh auto 0; text-align: center; padding: 0 16px; }
    .welcome-logo {
      width: 54px; height: 54px; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; font-weight: 800; font-size: 24px;
      color: white; margin: 0 auto 18px; box-shadow: 0 8px 30px rgba(108,92,231,0.3);
    }
    .welcome h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.8px; }
    .welcome p { margin: 0 auto 24px; color: var(--muted); max-width: 480px; line-height: 1.6; }
    .suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .suggestion {
      text-align: left; padding: 12px 14px; border-radius: 11px;
      border: 1px solid var(--border); background: var(--bg-elev);
      color: var(--muted); font-size: 13px; transition: 0.15s;
    }
    .suggestion:hover { border-color: var(--accent); color: var(--text); background: rgba(108,92,231,0.08); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 20px; backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 100%; max-width: 480px; background: var(--bg-elev);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); max-height: 90dvh;
      display: flex; flex-direction: column;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px 12px; border-bottom: 1px solid var(--border);
    }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .modal-body {
      padding: 16px 18px; overflow-y: auto; display: flex;
      flex-direction: column; gap: 14px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    .field b { color: var(--text); }
    .field textarea, .field input[type="number"], .field select {
      width: 100%; background: var(--bg-elev-2); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 11px; color: var(--text);
      outline: none; font-size: 13.5px;
    }
    .field textarea:focus, .field input:focus, .field select:focus { border-color: var(--accent); }
    .field input[type="range"] { width: 100%; accent-color: var(--accent); }
    .modal-divider { height: 1px; background: var(--border); margin: 2px 0; }
    .danger-btn {
      padding: 9px 12px; border-radius: 9px; border: 1px solid rgba(255,92,122,0.4);
      background: rgba(255,92,122,0.08); color: var(--danger); font-size: 13px; font-weight: 600;
    }
    .danger-btn:hover { background: rgba(255,92,122,0.16); }
    .modal-foot {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 12px 18px 16px; border-top: 1px solid var(--border);
    }
    .ghost-btn, .primary-btn {
      padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 600;
    }
    .ghost-btn { border: 1px solid var(--border); background: transparent; color: var(--muted); }
    .ghost-btn:hover { color: var(--text); }
    .primary-btn { border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; }
    .attachment-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 2px 8px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
    @media (max-width: 800px) {
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0;
        transform: translateX(-100%); transition: transform 0.25s ease;
        box-shadow: 20px 0 60px rgba(0,0,0,0.4);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.show { display: block; }
      .menu-btn, .close-sidebar { display: inline-flex !important; }
      .messages { padding: 16px 12px 6px; }
      .msg.user .bubble { max-width: 92%; }
      .suggestions { grid-template-columns: 1fr; }
      .composer-wrap { padding: 8px 12px 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand">Forcx <span>Agent Ai</span></div>
        <button class="icon-btn close-sidebar" id="closeSidebar" type="button">×</button>
      </div>
      <button class="new-chat-btn" id="newChatBtn" type="button">
        <span>+</span> New chat
      </button>
      <label class="incognito-toggle">
        <input type="checkbox" id="incognitoToggle" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span>Incognito mode</span>
      </label>
      <div class="sidebar-label">Recent chats</div>
      <div class="history" id="historyList"></div>
      <div class="sidebar-footer">
        <button class="prefs-btn" id="prefsBtn" type="button">⚙ Preferences</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button">☰</button>
        <div class="model-badge">claude-opus-5-5</div>
        <div class="topbar-right">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Ready</span>
        </div>
      </header>
      <div class="incognito-banner" id="incognitoBanner">
        🕶️ Incognito mode — this conversation won't be saved.
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer-wrap">
        <div class="composer">
          <div class="attachment-bar" id="attachmentBar"></div>
          <textarea id="input" rows="1" placeholder="Message Forcx Agent Ai… (Shift+Enter for new line)"></textarea>
          <div class="composer-actions">
            <label class="attach-btn" title="Attach a ZIP project">
              📎 ZIP
              <input type="file" id="zipInput" accept=".zip,application/zip" hidden />
            </label>
            <button class="send-btn" id="sendBtn" type="button">Send</button>
          </div>
        </div>
        <div class="composer-hint">
          Forcx Agent Ai can make mistakes. Verify important code. ZIP files are read locally in your browser.
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="prefsModal">
    <div class="modal">
      <div class="modal-head">
        <h2>Preferences</h2>
        <button class="icon-btn" id="closePrefs" type="button">×</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>System prompt</span>
          <textarea id="systemPrompt" rows="4"></textarea>
        </label>
        <label class="field">
          <span>Temperature <b id="tempValue">0.7</b></span>
          <input type="range" id="temperature" min="0" max="1.5" step="0.1" value="0.7" />
        </label>
        <label class="field">
          <span>Max tokens</span>
          <input type="number" id="maxTokens" min="256" max="32000" step="256" value="4096" />
        </label>
        <label class="field">
          <span>Theme</span>
          <select id="themeSelect">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <div class="modal-divider"></div>
        <button class="danger-btn" id="clearChats" type="button">Delete all saved chats</button>
      </div>
      <div class="modal-foot">
        <button class="ghost-btn" id="cancelPrefs" type="button">Cancel</button>
        <button class="primary-btn" id="savePrefs" type="button">Save preferences</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    const DEFAULT_PREFS = {
      systemPrompt: 'You are Forcx Agent Ai, a helpful, precise AI assistant. Answer clearly, write production-ready code, and explain trade-offs briefly. When giving code, always use fenced code blocks with the correct language tag.',
      temperature: 0.7,
      maxTokens: 4096,
      theme: 'dark',
    };

    const state = {
      chats: [],
      currentChatId: null,
      messages: [],
      incognito: false,
      prefs: { ...DEFAULT_PREFS },
      attachments: [],
      isStreaming: false,
      abortController: null,
    };

    let mdRenderer = null;
    let pendingRender = null;
    let renderRaf = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function uid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'chat-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    }

    function langFromPath(filePath) {
      const ext = filePath.split('.').pop().toLowerCase();
      const map = {
        js: 'javascript', jsx: 'jsx', mjs: 'javascript', cjs: 'javascript',
        ts: 'typescript', tsx: 'tsx', json: 'json', html: 'html', htm: 'html',
        css: 'css', scss: 'scss', sass: 'sass', less: 'less', md: 'markdown',
        mdx: 'markdown', txt: 'text', py: 'python', java: 'java', kt: 'kotlin',
        c: 'c', cpp: 'cpp', cc: 'cpp', h: 'c', hpp: 'cpp', cs: 'csharp',
        go: 'go', rs: 'rust', php: 'php', rb: 'ruby', yml: 'yaml',
        yaml: 'yaml', xml: 'xml', svg: 'xml', sh: 'bash', bash: 'bash',
        zsh: 'bash', sql: 'sql', toml: 'toml', ini: 'ini', cfg: 'ini',
        vue: 'vue', svelte: 'svelte', astro: 'astro', prisma: 'prisma',
        graphql: 'graphql', gql: 'graphql',
      };
      return map[ext] || '';
    }

    function initMarkdownRenderer() {
      if (typeof marked === 'undefined') return;
      mdRenderer = new marked.Renderer();
      mdRenderer.code = function (code, infostring) {
        const lang = (infostring || '').trim().split(/\s+/)[0] || 'code';
        return '<div class="code-block"><div class="code-head"><span class="code-lang">' +
          escapeHtml(lang) + '</span><button class="copy-btn" type="button">Copy</button></div>' +
          '<pre><code>' + escapeHtml(code) + '</code></pre></div>';
      };
      mdRenderer.link = function (href, title, text) {
        const t = title ? ' title="' + escapeHtml(title) + '"' : '';
        return '<a href="' + escapeHtml(href) + '"' + t + ' target="_blank" rel="noopener noreferrer">' + text + '</a>';
      };
    }

    function renderMarkdown(text) {
      if (!text) return '';
      if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined' && mdRenderer) {
        try {
          const html = marked.parse(text, { renderer: mdRenderer, breaks: true, gfm: true });
          return DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
        } catch (err) { console.warn(err); }
      }
      return '<pre class="fallback-pre">' + escapeHtml(text) + '</pre>';
    }

    function loadPrefs() {
      try {
        const raw = localStorage.getItem('forcx_prefs');
        if (raw) state.prefs = { ...DEFAULT_PREFS, ...JSON.parse(raw) };
      } catch (_) {}
      applyTheme();
    }

    function savePrefs() {
      try { localStorage.setItem('forcx_prefs', JSON.stringify(state.prefs)); } catch (_) {}
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.prefs.theme || 'dark');
    }

    function loadChats() {
      if (state.incognito) return;
      try {
        const raw = localStorage.getItem('forcx_chats');
        if (raw) state.chats = JSON.parse(raw);
        if (!Array.isArray(state.chats)) state.chats = [];
      } catch (_) { state.chats = []; }
      renderHistory();
    }

    function saveChats() {
      if (state.incognito) return;
      try { localStorage.setItem('forcx_chats', JSON.stringify(state.chats)); } catch (_) {}
    }

    function getCurrentChat() {
      return state.chats.find((c) => c.id === state.currentChatId);
    }

    function ensureChat() {
      if (state.incognito) return null;
      if (!state.currentChatId) {
        const chat = { id: uid(), title: 'New chat', messages: [], createdAt: Date.now() };
        state.chats.unshift(chat);
        state.currentChatId = chat.id;
        return chat;
      }
      return getCurrentChat();
    }

    function newChat(options = {}) {
      if (state.isStreaming) stopStreaming();
      state.currentChatId = null;
      state.messages = [];
      state.attachments = [];
      renderMessages();
      renderAttachments();
      renderHistory();
      const input = $('#input');
      input.value = '';
      updateComposerHeight();
      if (!options.silent) input.focus();
      closeSidebar();
    }

    function loadChat(id) {
      if (state.isStreaming) stopStreaming();
      const chat = state.chats.find((c) => c.id === id);
      if (!chat) return;
      state.currentChatId = id;
      state.messages = JSON.parse(JSON.stringify(chat.messages || []));
      state.attachments = [];
      renderMessages();
      renderAttachments();
      renderHistory();
      closeSidebar();
    }

    function deleteChat(id) {
      state.chats = state.chats.filter((c) => c.id !== id);
      if (state.currentChatId === id) newChat({ silent: true });
      saveChats();
      renderHistory();
    }

    function welcomeHtml() {
      const suggestions = [
        'Explain this codebase structure',
        'Write a React component with Tailwind',
        'Debug this error message',
        'Summarize this project ZIP',
      ];
      return '<div class="welcome"><div class="welcome-logo">F</div>' +
        '<h1>Forcx Agent Ai</h1>' +
        '<p>Your simple, powerful AI workspace. Ask anything, paste code, or drop a ZIP project.</p>' +
        '<div class="suggestions">' +
        suggestions.map((s) => '<button class="suggestion" type="button">' + escapeHtml(s) + '</button>').join('') +
        '</div></div>';
    }

    function messageHtml(message, index) {
      if (message.role === 'user') {
        let attachHtml = '';
        if (message.attachments && message.attachments.length) {
          attachHtml = '<div class="msg-attachments">' + message.attachments.map((a) =>
            '<span class="attachment-chip">📦 ' + escapeHtml(a.name) + ' · ' + a.files.length + ' files</span>'
          ).join('') + '</div>';
        }
        return '<div class="msg user" data-index="' + index + '">' +
          '<div class="avatar">You</div><div class="bubble">' + attachHtml +
          '<div class="message-content">' + escapeHtml(message.content).replace(/\n/g, '<br>') +
          '</div></div></div>';
      }
      return '<div class="msg assistant" data-index="' + index + '">' +
        '<div class="avatar ai">F</div><div class="bubble">' +
        '<div class="message-content">' + renderMarkdown(message.content) +
        '</div></div></div>';
    }

    function renderMessages() {
      const container = $('#messages');
      if (state.messages.length === 0) {
        container.innerHTML = welcomeHtml();
        bindWelcomeSuggestions();
        return;
      }
      container.innerHTML = state.messages.map((m, i) => messageHtml(m, i)).join('');
      container.scrollTop = container.scrollHeight;
    }

    function bindWelcomeSuggestions() {
      $$('.suggestion').forEach((btn) => {
        btn.addEventListener('click', () => {
          const input = $('#input');
          input.value = btn.textContent;
          updateComposerHeight();
          input.focus();
        });
      });
    }

    function updateAssistantContent(el, text) {
      if (!el) return;
      pendingRender = null;
      el.innerHTML = renderMarkdown(text);
      const container = $('#messages');
      container.scrollTop = container.scrollHeight;
    }

    function scheduleAssistantRender(el, text) {
      if (!el) return;
      pendingRender = { el, text };
      if (renderRaf) return;
      renderRaf = requestAnimationFrame(() => {
        renderRaf = null;
        if (pendingRender && pendingRender.el) {
          pendingRender.el.innerHTML = renderMarkdown(pendingRender.text);
          const container = $('#messages');
          container.scrollTop = container.scrollHeight;
        }
        pendingRender = null;
      });
    }

    function renderHistory() {
      const list = $('#historyList');
      if (state.incognito) {
        list.innerHTML = '<div class="history-empty">Incognito mode — chats are not saved.</div>';
        return;
      }
      if (!state.chats.length) {
        list.innerHTML = '<div class="history-empty">No chats yet.</div>';
        return;
      }
      list.innerHTML = state.chats.map((c) =>
        '<div class="history-item ' + (c.id === state.currentChatId ? 'active' : '') +
        '" data-id="' + c.id + '"><span class="history-title">' + escapeHtml(c.title) +
        '</span><button class="history-del" data-del="' + c.id + '" title="Delete">×</button></div>'
      ).join('');
    }

    function renderAttachments() {
      const bar = $('#attachmentBar');
      if (!state.attachments.length) {
        bar.innerHTML = '';
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      bar.innerHTML = state.attachments.map((a, i) =>
        '<span class="attachment-chip">📦 ' + escapeHtml(a.name) + ' · ' + a.files.length +
        ' files<button class="attachment-remove" data-remove="' + i + '" type="button">×</button></span>'
      ).join('');
    }

    function updateComposerHeight() {
      const ta = $('#input');
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
    }

    function updateSendButton() {
      const btn = $('#sendBtn');
      btn.textContent = state.isStreaming ? 'Stop' : 'Send';
      btn.classList.toggle('stop', state.isStreaming);
      $('#statusDot').classList.toggle('busy', state.isStreaming);
      $('#statusText').textContent = state.isStreaming ? 'Thinking…' : 'Ready';
    }

    function stopStreaming() {
      if (state.abortController) state.abortController.abort();
      state.isStreaming = false;
      updateSendButton();
    }

    function buildZipContext(attachments) {
      let out = '';
      for (const a of attachments) {
        out += '\n[Attached ZIP: ' + a.name + ']\n';
        for (const f of a.files) {
          out += '\n--- FILE: ' + f.path + ' ---\n```' + langFromPath(f.path) + '\n' + f.content + '\n```\n';
        }
      }
      return out;
    }

    function buildApiMessages() {
      const messages = [];
      if (state.prefs.systemPrompt.trim()) {
        messages.push({ role: 'system', content: state.prefs.systemPrompt.trim() });
      }
      for (const m of state.messages) {
        if (m.role === 'assistant' && !m.content) continue;
        let content = m.content || '';
        if (m.attachments && m.attachments.length) {
          content = buildZipContext(m.attachments) + '\n\n' + content;
        }
        messages.push({ role: m.role, content });
      }
      return messages;
    }

    async function sendMessage() {
      if (state.isStreaming) { stopStreaming(); return; }
      const input = $('#input');
      const text = input.value.trim();
      if (!text && state.attachments.length === 0) return;

      const userMessage = {
        role: 'user',
        content: text,
        attachments: state.attachments.map((a) => ({ name: a.name, files: a.files })),
      };
      state.messages.push(userMessage);
      state.attachments = [];
      input.value = '';
      updateComposerHeight();
      renderAttachments();
      renderMessages();

      const chat = ensureChat();
      if (chat) {
        chat.messages = state.messages;
        if (chat.title === 'New chat') {
          chat.title = text ? text.replace(/\s+/g, ' ').slice(0, 48) : 'ZIP project';
        }
        saveChats();
        renderHistory();
      }
      await requestAssistant();
    }

    async function requestAssistant() {
      state.isStreaming = true;
      state.abortController = new AbortController();
      updateSendButton();

      const assistantMessage = { role: 'assistant', content: '' };
      state.messages.push(assistantMessage);
      renderMessages();

      const messageEls = $('#messages').querySelectorAll('.msg');
      const lastEl = messageEls[messageEls.length - 1];
      const contentEl = lastEl ? lastEl.querySelector('.message-content') : null;

      const payload = {
        model: 'claude-opus-5-5',
        messages: buildApiMessages(),
        temperature: state.prefs.temperature,
        max_tokens: state.prefs.maxTokens,
        stream: true,
      };

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: state.abortController.signal,
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error('API ' + response.status + ': ' + errText.slice(0, 400));
        }

        const contentType = response.headers.get('content-type') || '';
        let fullText = '';

        if (contentType.includes('text/event-stream')) {
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('data:')) continue;
              const data = trimmed.slice(5).trim();
              if (!data || data === '[DONE]') continue;
              try {
                const json = JSON.parse(data);
                const delta = json.choices?.[0]?.delta?.content ?? '';
                if (delta) {
                  fullText += delta;
                  assistantMessage.content = fullText;
                  scheduleAssistantRender(contentEl, fullText);
                }
              } catch (_) {}
            }
          }
        } else {
          const raw = await response.text();
          let data;
          try { data = JSON.parse(raw); }
          catch (_) { data = { error: { message: raw.slice(0, 500) } }; }
          const content = data.choices?.[0]?.message?.content ?? data.error?.message ?? '';
          fullText = content;
          assistantMessage.content = content;
          updateAssistantContent(contentEl, content);
        }

        if (!fullText) {
          assistantMessage.content = '_No content returned._';
          updateAssistantContent(contentEl, assistantMessage.content);
        } else {
          updateAssistantContent(contentEl, fullText);
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          assistantMessage.content = assistantMessage.content || '_Stopped._';
        } else {
          assistantMessage.content = '**Error:** ' + (err.message || 'Unknown error');
        }
        updateAssistantContent(contentEl, assistantMessage.content);
      } finally {
        state.isStreaming = false;
        state.abortController = null;
        updateSendButton();
        const chat = getCurrentChat();
        if (chat) { chat.messages = state.messages; saveChats(); }
      }
    }

    const TEXT_EXTS = new Set([
      'js','jsx','mjs','cjs','ts','tsx','json','html','htm','css','scss','sass','less',
      'md','mdx','txt','py','java','kt','c','cpp','cc','h','hpp','cs','go','rs','php','rb',
      'yml','yaml','xml','svg','sh','bash','zsh','sql','env','toml','ini','cfg','conf',
      'vue','svelte','astro','prisma','graphql','gql','dockerfile','makefile','gitignore',
    ]);
    const SKIP_DIRS = ['node_modules/','.git/','dist/','build/','__pycache__/','.next/','venv/','.venv/','coverage/'];
    const SKIP_FILES = new Set(['package-lock.json','yarn.lock','pnpm-lock.yaml','composer.lock']);

    async function extractZip(file) {
      if (typeof JSZip === 'undefined') throw new Error('JSZip library not loaded.');
      const zip = await JSZip.loadAsync(file);
      const files = [];
      let totalChars = 0;
      const MAX_TOTAL = 180000, MAX_FILES = 60, MAX_FILE = 60000;
      const entries = Object.values(zip.files).filter((e) => !e.dir);
      for (const entry of entries) {
        if (files.length >= MAX_FILES || totalChars >= MAX_TOTAL) break;
        const filePath = entry.name;
        const base = filePath.split('/').pop();
        if (SKIP_DIRS.some((d) => filePath.startsWith(d))) continue;
        if (SKIP_FILES.has(base)) continue;
        const ext = base.includes('.') ? base.split('.').pop().toLowerCase() : '';
        const isText = TEXT_EXTS.has(ext) || base === '.gitignore' || base === '.env' ||
          base.startsWith('Dockerfile') || base.startsWith('Makefile');
        if (!isText) continue;
        try {
          const content = await entry.async('string');
          if (content.includes('\0')) continue;
          if (content.length > MAX_FILE) continue;
          const remaining = MAX_TOTAL - totalChars;
          const clipped = content.slice(0, remaining);
          totalChars += clipped.length;
          files.push({ path: filePath, content: clipped });
        } catch (_) {}
      }
      if (!files.length) throw new Error('No readable text/code files found in this ZIP.');
      return files;
    }

    async function handleZipFile(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.zip')) { alert('Please choose a .zip file.'); return; }
      try {
        const files = await extractZip(file);
        state.attachments.push({ name: file.name, files });
        renderAttachments();
      } catch (err) { alert('Failed to read ZIP: ' + err.message); }
    }

    function openPrefs() {
      $('#systemPrompt').value = state.prefs.systemPrompt;
      $('#temperature').value = state.prefs.temperature;
      $('#tempValue').textContent = state.prefs.temperature;
      $('#maxTokens').value = state.prefs.maxTokens;
      $('#themeSelect').value = state.prefs.theme;
      $('#prefsModal').classList.add('open');
    }
    function closePrefs() { $('#prefsModal').classList.remove('open'); }

    $('#newChatBtn').addEventListener('click', () => newChat());
    $('#prefsBtn').addEventListener('click', openPrefs);
    $('#closePrefs').addEventListener('click', closePrefs);
    $('#cancelPrefs').addEventListener('click', closePrefs);
    $('#prefsModal').addEventListener('click', (e) => { if (e.target.id === 'prefsModal') closePrefs(); });
    $('#temperature').addEventListener('input', (e) => { $('#tempValue').textContent = e.target.value; });
    $('#savePrefs').addEventListener('click', () => {
      state.prefs.systemPrompt = $('#systemPrompt').value;
      state.prefs.temperature = parseFloat($('#temperature').value);
      state.prefs.maxTokens = parseInt($('#maxTokens').value, 10) || DEFAULT_PREFS.maxTokens;
      state.prefs.theme = $('#themeSelect').value;
      savePrefs(); applyTheme(); closePrefs();
    });
    $('#clearChats').addEventListener('click', () => {
      if (!confirm('Delete all saved chats? This cannot be undone.')) return;
      state.chats = []; state.currentChatId = null; state.messages = [];
      saveChats(); renderHistory(); renderMessages(); closePrefs();
    });
    $('#incognitoToggle').addEventListener('change', (e) => {
      const chat = getCurrentChat();
      if (chat && state.messages.length) { chat.messages = state.messages; saveChats(); }
      state.incognito = e.target.checked;
      if (state.incognito) {
        state.currentChatId = null; state.messages = []; state.attachments = [];
        renderMessages(); renderAttachments();
      } else { loadChats(); }
      $('#incognitoBanner').style.display = state.incognito ? 'flex' : 'none';
      renderHistory();
    });
    $('#historyList').addEventListener('click', (e) => {
      const delBtn = e.target.closest('[data-del]');
      if (delBtn) { e.stopPropagation(); deleteChat(delBtn.dataset.del); return; }
      const item = e.target.closest('.history-item');
      if (item) loadChat(item.dataset.id);
    });
    $('#attachmentBar').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove]');
      if (!btn) return;
      state.attachments.splice(Number(btn.dataset.remove), 1);
      renderAttachments();
    });
    $('#zipInput').addEventListener('change', async (e) => {
      await handleZipFile(e.target.files[0]);
      e.target.value = '';
    });
    $('#input').addEventListener('input', updateComposerHeight);
    $('#input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault(); sendMessage();
      }
    });
    $('#sendBtn').addEventListener('click', sendMessage);
    $('#messages').addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;
      const block = btn.closest('.code-block');
      const code = block ? block.querySelector('code').innerText : '';
      try { await navigator.clipboard.writeText(code); }
      catch (_) {
        const ta = document.createElement('textarea');
        ta.value = code; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      const oldText = btn.textContent;
      btn.textContent = 'Copied!'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = oldText; btn.classList.remove('copied'); }, 1400);
    });
    function openSidebar() { $('#sidebar').classList.add('open'); $('#sidebarOverlay').classList.add('show'); }
    function closeSidebar() { $('#sidebar').classList.remove('open'); $('#sidebarOverlay').classList.remove('show'); }
    $('#menuBtn').addEventListener('click', openSidebar);
    $('#closeSidebar').addEventListener('click', closeSidebar);
    $('#sidebarOverlay').addEventListener('click', closeSidebar);

    initMarkdownRenderer();
    loadPrefs();
    loadChats();
    newChat({ silent: true });
  </script>
</body>
</html>
